agenthouse-evaluate:
  image: node:22
  stage: test
  script:
    - npm ci --ignore-scripts
    - node node_modules/@agenthouse/engineering/bin/ah-engineering.js evaluate --profile pull-request --ci --frozen --subject "$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - artifacts/agenthouse/
    reports:
      junit: artifacts/agenthouse/*/junit.xml

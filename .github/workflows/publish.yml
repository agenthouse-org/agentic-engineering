name: Publish to npm

on:
  release:
    types: [published]
  # Manual runs verify packaging without publishing a version.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/validate-npm-release.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Pack and test the distributable
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          node bin/ah-engineering.js bundle --output "dist/agenthouse-engineering-${{ github.event.release.tag_name || 'dry-run' }}.bundle.json"
          npm install --prefix /tmp/ah-package-smoke --ignore-scripts --no-audit --no-fund ./dist/*.tgz
          node /tmp/ah-package-smoke/node_modules/@agenthouse/engineering/bin/ah-engineering.js demo --root /tmp/ah-release-demo
      - name: Keep the tested archive
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            dist/*.tgz
            dist/*.bundle.json
          if-no-files-found: error
      - name: Attest the GitHub update bundle
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.bundle.json
      - name: Attach the attested update bundle to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.bundle.json --repo "$GITHUB_REPOSITORY"
      - name: Verify publishing command without publishing
        if: github.event_name == 'workflow_dispatch'
        # A manual run may use an already published version. Force bypasses
        # that preflight only here; dry-run prevents registry mutation.
        run: npm publish ./dist/*.tgz --access public --ignore-scripts --dry-run --force
      - name: Publish release with trusted authentication
        if: github.event_name == 'release'
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish ./dist/*.tgz --access public --ignore-scripts --tag "$NPM_DIST_TAG"
